services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports: ["1522:1521"]
    environment:
      ORACLE_PASSWORD: oracle_local_2026
      APP_USER: bomerp
      APP_USER_PASSWORD: bomerp_local_2026
    volumes: ["oracle-data:/opt/oracle/oradata"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    ports: ["8180:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak_local_2026
    volumes:
      - ./infra/maiz-erp-realm.json:/opt/keycloak/data/import/maiz-erp-realm.json:ro
      - keycloak-data:/opt/keycloak/data
volumes:
  oracle-data:
  keycloak-data:
