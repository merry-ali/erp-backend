<a routerLink="/produccion">← Producción</a><h1>Nueva fórmula</h1><p>Define la cantidad de cada insumo necesaria por unidad de producto terminado.</p>@if(error()){<p class="alert error">{{error()}}</p>}<form [formGroup]="form" (ngSubmit)="guardar()" class="card"><div class="form-grid"><label>Nombre<input formControlName="nombre"></label><label>Producto terminado<select formControlName="codigoProductoTerminado"><option value="">Seleccionar</option>@for(a of articulos();track a.id){@if(a.tipoArticulo==='PRODUCTO_TERMINADO'){<option [value]="a.codigo">{{a.nombre}}</option>}}</select></label></div><h2>Detalle de insumos</h2><div formArrayName="detalles">@for(f of filas.controls;track f;let i=$index){<div [formGroupName]="i" class="line-row"><label>Insumo<select formControlName="codigoArticulo" (change)="unidad(i)"><option value="">Seleccionar</option>@for(a of articulos();track a.id){<option [value]="a.codigo">{{a.nombre}}</option>}</select></label><label>Cantidad por unidad<input type="number" step="0.0001" formControlName="cantidadPorUnidad"></label><label>Unidad<input formControlName="unidadMedida" readonly></label><button type="button" (click)="filas.removeAt(i)">Quitar</button></div>}</div><div class="actions"><button type="button" (click)="agregar()">+ Agregar insumo</button><button class="primary" [disabled]="ocupado()">Guardar fórmula</button></div></form>
